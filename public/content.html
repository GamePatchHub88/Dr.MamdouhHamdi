function applyT(){document.querySelectorAll('[data-t]').forEach(e=>{const v=(S['t_'+e.dataset.t]||'').trim();if(v)e.textContent=v})}
function applyF(){const g=new Set(),css=[],pick=(k,sel)=>{const n=(S[k]||'').trim();if(!FN[n])return;g.add('family='+FN[n]);css.push(sel+"{font-family:'"+n+"','IBM Plex Sans Arabic',Tahoma,sans-serif!important}")};pick('f_body','body');pick('f_head','h1,h2,h3,.brand');if(!g.size)return;const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?'+[...g].join('&')+'&display=swap';document.head.appendChild(l);const st=document.createElement('style');st.textContent=css.join('');document.head.appendChild(st)}
const SP=jget('/api/settings').then(s=>{s=s&&typeof s=='object'?s:{};Object.assign(S,s);applyT();applyF();if(s.img_mark)document.querySelectorAll('.brand img').forEach(i=>i.src=s.img_mark)}).catch(()=>{});
if(new URLSearchParams(location.search).get('tab')=='article')location.replace('/articles.html'+(new URLSearchParams(location.search).get('id')?'?id='+encodeURIComponent(new URLSearchParams(location.search).get('id')):''));
const TABS=[['podcast','البودكاست','mic','استمع إلى حلقاتنا في أي وقت.'],['book','المكتبة النفسية','book','كتب ومراجع مختارة.'],['course','الدورات','cap','دورات تدريبية لتطوير نفسك.']];

const qs=new URLSearchParams(location.search),PAGE=9;let cur=TABS.some(t=>t[0]==qs.get('tab'))?qs.get('tab'):'podcast',L=[],shown=PAGE;
const fmtD=d=>{try{return new Date(d).toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'})}catch(e){return ''}};
const rtOf=w=>Math.max(1,Math.round(w/180));
const lnk=(t,i)=>'/content.html?tab='+t+'&id='+encodeURIComponent(i._id);
function card(i,t){const rd=t=='article'||i.hasBody,go=lnk(t,i),rt=i.words?rtOf(i.words):0;
return `<div class="card"><span class="chip">${esc(T('chip_'+t,NM[t]))}</span>${i.image?`<img src="${esc(i.image)}" alt="" loading="lazy">`:`<div class="th">${U(IC[t])}</div>`}<div class="b"><h3>${rd?`<a href="${go}">${esc(i.title)}</a>`:esc(i.title)}</h3><span class="mt">${[i.createdAt?fmtD(i.createdAt):'',t=='article'&&rt?T('read_time','قراءة {n} د').replace('{n}',rt):''].filter(Boolean).map(esc).join(' · ')}</span><p>${esc((i.desc||'').slice(0,140))}</p>${t=='podcast'&&i.url?`<audio controls preload="none" src="${esc(i.url)}"></audio>`:rd?`<a class="btn sm" href="${go}">${esc(T('read_more','اقرأ المزيد'))}</a>`:isU(i.url)?`<a class="btn sm" target=_blank rel=noopener href="${esc(i.url)}">${esc(T('open','فتح'))}</a>`:''}</div></div>`}
function draw(){const k=q.value.trim().toLowerCase(),F=L.filter(i=>!k||((i.title||'')+' '+(i.desc||'')).toLowerCase().includes(k));
grid.innerHTML=F.length?F.slice(0,shown).map(i=>card(i,cur)).join(''):'<div class="empty">'+U(k?'file':IC[cur])+'<b>'+esc(k?'لا توجد نتائج مطابقة':T('empty','سيتم إضافة المحتوى قريباً'))+'</b></div>';lm.style.display=F.length>shown?'':'none'}
async function loadTab(t,push){cur=t;shown=PAGE;q.value='';const m=TABS.find(x=>x[0]==t);
tabs.innerHTML=TABS.map(x=>`<button class="${x[0]==t?'on':''}" data-t2="${x[0]}">${U(x[2])}${esc(x[1])}</button>`).join('');
h1.textContent=m[1];sub.textContent=m[3];document.title=m[1]+' | دوبامين — د. ممدوح حمدي';if(push)history.replaceState(null,'','?tab='+t);

/* ---- article body formatter ---- */
function fmt(b){const ln=esc(b).replace(/\r/g,'').split('\n'),inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');let h='',ul=0;
const cu=()=>{if(ul){h+='</ul>';ul=0}};let prevBlank=true;
ln.forEach((raw,k)=>{const l=raw.trim();if(!l){cu();prevBlank=true;return}let m;
if(m=l.match(/^#{1,4}\s+(.+)/)){cu();h+='<h2>'+inl(m[1])+'</h2>'}
else if(m=l.match(/^[-•*]\s+(.+)/)){if(!ul){h+='<ul>';ul=1}h+='<li>'+inl(m[1])+'</li>'}
else if(m=l.match(/^&gt;\s*(.+)/)){cu();h+='<blockquote>'+inl(m[1])+'</blockquote>'}
else{cu();const nx=(ln[k+1]||'').trim();
if(prevBlank&&nx&&l.length<=70&&!/[.،,؛:!؟?…"”»)]$/.test(l))h+='<h2>'+inl(l)+'</h2>';else h+='<p>'+inl(l)+'</p>'}
prevBlank=false});cu();return h}
async function openReader(id){listv.style.display='none';readv.style.display='block';scrollTo(0,0);
rd.innerHTML='<div class="sk" style="height:420px"></div>';rel.innerHTML='';

const t=NM[i.type]?i.type:cur,w=(i.body||'').trim().split(/\s+/).filter(Boolean).length,meta=[];

+(i.image?`<img class="cover" src="${esc(i.image)}" alt="">`:'')+(t=='podcast'&&isU(i.url)?`<audio controls preload="none" src="${esc(i.url)}"></audio>`:'')
+(i.desc&&i.body?`<p class="lead">${esc(i.desc)}</p>`:'')+`<div class="body">${i.body?fmt(i.body):(i.desc?'<p>'+esc(i.desc)+'</p>':'')}</div>`

+`<div class="cta"><div><h3>${esc(T('fcta_h','خطوتك الأولى نحو حياة أكثر توازناً'))}</h3><p>${esc(T('fcta_p','جلسات سرية بالكامل، ونتواصل معك في أقرب وقت.'))}</p></div><a class="btn" href="/#book">${U('cal')}${esc(T('btn_book','احجز استشارتك'))}</a></div>`;

const r=await jget('/api/items?type='+t+'&limit=4&lite=1'),o=(Array.isArray(r)?r:[]).filter(x=>x._id!=i._id).slice(0,3);
if(o.length)rel.innerHTML='<h2>'+esc('المزيد من '+TABS.find(x=>x[0]==t)[1])+'</h2><div class="grid">'+o.map(x=>card(x,t)).join('')+'</div>'}
addEventListener('scroll',()=>{const m=document.documentElement.scrollHeight-innerHeight;pg.style.transform='scaleX('+(m>0?scrollY/m:0)+')'},{passive:true});
