<!DOCTYPE html><html lang="ar" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2b7bd0"><meta name="description" id="md" content="مقالات د. ممدوح حمدي في الصحة النفسية والأسرية وتعديل السلوك.">
<title>المقالات | دوبامين — د. ممدوح حمدي</title><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=El+Messiri:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=El+Messiri:wght@500;600;700&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="/css/rich.css?v=1">
<style>
:root{--p:#2b7bd0;--p2:#4aa8ee;--r:24px;--gr:linear-gradient(135deg,var(--p),var(--p2));--gold:linear-gradient(135deg,#d9b25a,#f3dc96);
--g:16px;--gut:max(var(--g),env(safe-area-inset-left),env(safe-area-inset-right));--max:1240px;--navh:66px;--hh:calc(var(--navh) + env(safe-area-inset-top));--tap:44px;--read:44rem;--serif:'El Messiri','IBM Plex Sans Arabic',serif}
@media(min-width:561px){:root{--g:20px}}
@media(min-width:1600px){:root{--max:1360px}}
[data-theme=light]{color-scheme:light;--bg:#f2f7fd;--bg2:#fff;--card:#fff;--tx:#0f2236;--mu:#566b82;--bd:#dfe9f5;--hd:#ffffffe6;--sh:0 10px 40px #0f2a4a14;--pt:#2b7bd0;--sk1:#e6eef9;--sk2:#f4f8fe}
[data-theme=dark]{color-scheme:dark;--bg:#08121f;--bg2:#0c1a2b;--card:#11233a;--tx:#eaf2fc;--mu:#9db3cc;--bd:#223a58;--hd:#08121fe6;--sh:0 10px 40px #0007;--pt:#7cc4ff;--sk1:#142c47;--sk2:#1f4064}

/* ===== base ===== */
*,*::before,*::after{box-sizing:border-box}*{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(var(--hh) + 16px)}
body{font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;background:var(--bg);color:var(--tx);line-height:1.85;transition:background .3s;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:clip}
main{flex:1;min-width:0}
a{color:inherit;text-decoration:none}
img,video,iframe{max-width:100%}img{height:auto}
.i{width:1.2em;height:1.2em;vertical-align:-.22em;flex:none}
.vh{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}

/* ===== header ===== */
header{position:sticky;top:0;z-index:60;background:var(--hd);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top)}
.nav{max-width:var(--max);margin-inline:auto;height:var(--navh);display:flex;align-items:center;gap:10px;padding-inline:var(--gut)}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:21px;margin-inline-end:auto;min-width:0;min-block-size:var(--tap)}
.brand img{width:46px;height:46px;border-radius:50%;object-fit:contain;padding:3px;background:#fff;border:2px solid #d9b25a;flex:none}
.brand small{display:block;font-size:12px;font-weight:500;color:var(--mu);line-height:1.2}.brand>span{line-height:1.25;min-width:0}
.btn{display:inline-flex;gap:9px;align-items:center;justify-content:center;min-block-size:var(--tap);background:var(--gr);color:#fff;font-family:inherit;font-weight:600;font-size:15px;line-height:1.4;text-align:center;border:0;border-radius:16px;padding:10px 26px;cursor:pointer;transition:transform .25s,box-shadow .25s;box-shadow:0 8px 24px #2b7bd044}
@media(hover:hover){.btn:hover{transform:translateY(-2px)}}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}.btn.sm{padding:8px 18px;font-size:14px;border-radius:12px}
.ib{inline-size:var(--tap);block-size:var(--tap);flex:none;border-radius:13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;font-size:19px}
.wrap{max-width:var(--max);margin-inline:auto;padding-inline:var(--gut)}

/* ===== list page ===== */
.ph{padding-block:clamp(30px,6vw,54px) 26px}
.ey{color:var(--pt);font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}.ey:before{content:"";width:26px;height:3px;border-radius:3px;background:var(--gold)}
.ph h1{font-family:var(--serif);font-size:clamp(2rem,1.4rem + 2.6vw,3.25rem);line-height:1.3;margin-block:6px 4px;overflow-wrap:anywhere}
.ph p{color:var(--mu);max-width:36rem}
.bar{position:sticky;top:var(--hh);z-index:40;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--bd)}
.bar .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sort{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x proximity;min-width:0;max-width:100%;padding-block:2px}.sort::-webkit-scrollbar{display:none}
.sort.ov{padding-inline:14px;margin-inline:-14px;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%)}
.sort button{flex:none;scroll-snap-align:center;display:inline-flex;align-items:center;min-block-size:var(--tap);white-space:nowrap;font-family:inherit;font-weight:600;font-size:14.5px;padding:0 18px;border-radius:40px;border:1px solid var(--bd);background:var(--card);color:var(--mu);cursor:pointer;transition:.2s}
.sort button:hover{color:var(--pt)}.sort button.on{background:var(--gr);color:#fff;border-color:transparent;box-shadow:0 6px 18px #2b7bd044}
.sr{position:relative;flex:1 1 220px;max-width:340px}
.sr .i{position:absolute;inset-inline-start:14px;inset-block-start:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
.sr input{width:100%;min-block-size:var(--tap);padding:8px 16px;padding-inline-start:42px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-family:inherit;font-size:16px}
.sr input:focus{outline:2px solid #2b7bd055;border-color:var(--pt)}
.list{padding-block:clamp(22px,4vw,34px) 70px}

/* cards grid: 1 col mobile, 2 tablet, 3 desktop */
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(16px,2.4vw,24px)}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;transition:transform .3s,box-shadow .3s;display:flex;flex-direction:column;position:relative;min-width:0}
@media(hover:hover){.card:hover{transform:translateY(-6px);box-shadow:var(--sh)}}
.card>img,.card .th{width:100%;aspect-ratio:16/10;height:auto;object-fit:cover;display:block;background:var(--sk1)}
.card .th{display:grid;place-items:center;background:linear-gradient(135deg,#2b7bd01f,#c9a24a22);color:var(--pt)}.card .th .i{width:50px;height:50px;stroke-width:1.2}
.card .b{padding:clamp(16px,2.4vw,20px);display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.card h3{font-size:clamp(1.0625rem,1rem + .3vw,1.125rem);line-height:1.6;overflow-wrap:anywhere}
.card h3 a{display:flex;align-items:center;min-block-size:var(--tap)}.card h3 a:hover{color:var(--pt)}
.card p{color:var(--mu);font-size:14px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .btn{align-self:flex-start;margin-top:auto}.card .mt{color:var(--mu);font-size:12.5px}
.chip{position:absolute;inset-block-start:12px;inset-inline-start:12px;z-index:2;background:#0f2a4acc;color:#fff;font-size:12px;font-weight:600;padding:3px 12px;border-radius:20px}
.card.feat{grid-column:1/-1;flex-direction:row}
.card.feat>img,.card.feat .th{width:48%;flex:none;aspect-ratio:auto;height:auto;min-height:300px}
.card.feat .b{padding:clamp(20px,3vw,30px);justify-content:center}
.card.feat h3{font-size:clamp(1.25rem,1rem + 1vw,1.625rem);line-height:1.5;font-family:var(--serif)}
.card.feat p{font-size:16px;-webkit-line-clamp:5;line-clamp:5}
@media(max-width:800px){.card.feat{flex-direction:column}.card.feat>img,.card.feat .th{width:100%;min-height:0;aspect-ratio:16/9}}
.st{display:flex;gap:6px 14px;color:var(--mu);font-size:12.5px;align-items:center;flex-wrap:wrap}.st span{display:inline-flex;gap:5px;align-items:center}.st .i{width:15px;height:15px}
.more{text-align:center;margin-top:34px}

/* skeleton / empty / error */
.sk{display:block;border-radius:10px;background:linear-gradient(90deg,var(--sk1) 25%,var(--sk2) 50%,var(--sk1) 75%);background-size:200% 100%;animation:sh 1.3s linear infinite}@keyframes sh{to{background-position:-200% 0}}
.skc{pointer-events:none}.skc .b{gap:12px}.sk-img{aspect-ratio:16/10;border-radius:0}.sk-l{height:14px}.sk-l.sm{height:11px}.sk-h{height:34px;margin-block:12px}.sk-cover{aspect-ratio:16/9;margin-block:20px;border-radius:var(--r)}
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--mu);padding:44px 20px;border:1.5px dashed var(--bd);border-radius:var(--r)}
.empty .i{width:38px;height:38px;color:var(--pt);opacity:.7}.empty b{color:var(--tx)}.empty .btn{margin-top:6px}
.empty.err .i{color:#e5646b;opacity:1}

/* ===== reader ===== */
.rd{position:relative;max-width:calc(var(--read) + 2*var(--gut));margin-inline:auto;padding:clamp(20px,4vw,40px) var(--gut) 70px;min-width:0}
.rd.aft{padding-block:0 30px}
.back{display:inline-flex;gap:8px;align-items:center;min-block-size:var(--tap);color:var(--pt);font-weight:600;font-size:15px;margin-block-end:10px}[dir=rtl] .back .i{transform:scaleX(-1)}
.rd .chip{position:static;display:inline-block;margin-block-end:14px}
.rd h1{font-family:var(--serif);font-size:clamp(1.75rem,1.25rem + 2.2vw,2.75rem);line-height:1.45;margin-block-end:14px;overflow-wrap:anywhere}
.meta{display:flex;gap:6px 18px;flex-wrap:wrap;color:var(--mu);font-size:14px;padding-block-end:20px;border-bottom:1px solid var(--bd);margin-block-end:26px}.meta span{display:inline-flex;gap:7px;align-items:center}
.cover{width:100%;aspect-ratio:16/9;height:auto;object-fit:cover;border-radius:var(--r);margin-block-end:28px;box-shadow:var(--sh);display:block;background:var(--sk1)}
.rd audio{width:100%;margin-block-end:24px}
.lead{font-size:clamp(1.0625rem,1rem + .4vw,1.25rem);color:var(--mu);line-height:2;border-inline-start:4px solid #d9b25a;padding-inline-start:18px;margin-block-end:28px;overflow-wrap:anywhere}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-block:34px 0;padding-block-start:24px;border-top:1px solid var(--bd)}
.cta{margin-block-start:36px;background:var(--gr);color:#fff;border-radius:28px;padding:clamp(22px,4vw,30px) clamp(22px,4vw,32px);display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.cta h3{font-size:clamp(1.1875rem,1rem + .8vw,1.375rem);line-height:1.5}.cta p{opacity:.9;font-size:15px}.cta .btn{background:#fff;color:var(--p);box-shadow:none}
.rel{max-width:var(--max);margin-inline:auto;padding-inline:var(--gut);padding-block-end:70px}.rel h2{font-size:clamp(1.3rem,1.1rem + .8vw,1.625rem);margin-block-end:22px}

/* reading progress */
#pg{position:fixed;inset-block-start:env(safe-area-inset-top);inset-inline:0;height:3px;z-index:100;background:linear-gradient(90deg,#2b7bd0,#4aa8ee,#d9b25a);transform-origin:100% 50%;transform:scaleX(0);opacity:0;transition:opacity .2s;pointer-events:none;will-change:transform}
[dir=ltr] #pg{transform-origin:0 50%}body.reading #pg{opacity:1}

/* tools / share / comments */
.tools{display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center;margin-block-end:22px;padding:10px 14px;background:var(--card);border:1px solid var(--bd);border-radius:18px}.tools .sp{flex:1}
.tools button,.tbtn{display:inline-flex;gap:7px;align-items:center;justify-content:center;min-block-size:var(--tap);min-inline-size:var(--tap);font-family:inherit;font-weight:600;font-size:13.5px;padding:0 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer;transition:.2s}
.tools button:hover,.tbtn:hover{border-color:var(--p2);color:var(--pt)}
.lk.on{background:#e5646b1c;border-color:#e5646b88;color:#e5646b}.lk.on .i{fill:#e5646b}
.dbn{background:#d9b25a22;border:1px solid #d9b25a77;color:#c9a24a;padding:10px 14px;border-radius:14px;font-weight:600;font-size:14px;margin-block-end:16px}

/* table of contents */
.toc{background:var(--card);border:1px solid var(--bd);border-radius:18px}
.toc b,.toc summary{display:flex;gap:8px;align-items:center;font-weight:700}
.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.toc a{display:flex;align-items:center;min-block-size:var(--tap);padding:6px 12px;border-radius:12px;border-inline-start:3px solid transparent;color:var(--mu);line-height:1.6;font-size:15px;overflow-wrap:anywhere;transition:background .2s,color .2s}
.toc a:hover{color:var(--pt)}.toc a.on{color:var(--pt);background:#2b7bd01f;border-inline-start-color:var(--p);font-weight:600}
.toc-m{margin-block-end:26px}
.toc-m summary{min-block-size:var(--tap);padding:6px 18px;cursor:pointer;list-style:none}.toc-m summary::-webkit-details-marker{display:none}
.toc-m summary .cur{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mu);font-weight:500;font-size:13.5px}
.toc-m summary .cv{margin-inline-start:auto;transition:transform .2s}.toc-m[open] summary .cv{transform:rotate(180deg)}
.toc-m ol{padding:0 10px 12px}
.tocs{display:none}
.toc li.lv3 a{padding-inline-start:26px;font-size:14px}.toc li.lv4 a{padding-inline-start:40px;font-size:13.5px}
@media(min-width:1280px){
.toc-m{display:none}
.tocs{display:block;position:absolute;inset-block:0;inset-inline-start:calc(100% + 1.5rem);width:14rem}
.tocs .toc{position:sticky;top:calc(var(--hh) + 20px);padding:14px 8px;max-block-size:calc(100vh - var(--hh) - 40px);max-block-size:calc(100dvh - var(--hh) - 40px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.tocs .toc b{padding:0 12px 8px}
}

.shr{margin-block-start:34px;padding:clamp(16px,3vw,20px) clamp(16px,3vw,22px);background:var(--card);border:1px solid var(--bd);border-radius:22px}.shr h4{font-size:16px;margin-block-end:12px}.shr .r{display:flex;gap:10px;flex-wrap:wrap}
.sb{display:inline-flex;gap:8px;align-items:center;justify-content:center;min-block-size:var(--tap);padding:0 16px;border-radius:13px;color:#fff;font-weight:600;font-size:14px;border:0;cursor:pointer;font-family:inherit;transition:transform .2s}
@media(hover:hover){.sb:hover{transform:translateY(-2px)}}
.sb .i{width:19px;height:19px}.sb.wa{background:#25d366}.sb.fb{background:#1877f2}.sb.tw{background:#111}[data-theme=dark] .sb.tw{background:#2a323c}.sb.tg{background:#229ed9}.sb.cp{background:var(--p)}
.cmt{margin-block-start:42px}.cmt h2{font-size:clamp(1.25rem,1.1rem + .6vw,1.5rem);display:flex;gap:10px;align-items:center;margin-block-end:18px}.cmt h2 .n{font-size:14px;background:var(--gold);color:#2e2000;border-radius:20px;padding:0 12px;font-weight:700}
.cf{display:grid;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:clamp(16px,3vw,22px);box-shadow:var(--sh);margin-block-end:26px}
.cf input,.cf textarea{width:100%;min-block-size:var(--tap);padding:12px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-family:inherit;font-size:16px}
.cf input:focus,.cf textarea:focus{outline:2px solid #2b7bd055;border-color:var(--pt)}.cf .hp{position:absolute;inset-inline-start:-9999px;width:1px;height:1px;opacity:0}
.cf .ft{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--mu);font-size:13px}.cf .msg{font-weight:600;font-size:14px}.cf .msg.ok{color:#2fb980}.cf .msg.er{color:#e5646b}
.cl{display:grid;gap:14px}.cc{display:flex;gap:14px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:clamp(14px,3vw,16px) clamp(14px,3vw,18px)}
.cc .av{width:44px;height:44px;border-radius:50%;background:var(--gr);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.cc b{font-size:15.5px}.cc small{color:var(--mu);margin-inline-start:8px;font-size:12.5px}.cc p{white-space:pre-line;margin-block-start:4px;line-height:1.9;overflow-wrap:anywhere}
.ca{display:flex;gap:8px;margin-block-start:8px;flex-wrap:wrap}
.ca button{min-block-size:var(--tap);min-inline-size:var(--tap);font-family:inherit;font-weight:600;font-size:12.5px;padding:0 14px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer;transition:.2s}
.ca button:hover{border-color:var(--p2);color:var(--pt)}.ca button.dl:hover{border-color:#e5646b;color:#e5646b}.ca button.ok{background:var(--gr);color:#fff;border-color:transparent}
.ce{width:100%;margin-block-start:6px;padding:11px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-family:inherit;font-size:16px;resize:vertical}.ce:focus{outline:2px solid #2b7bd055;border-color:var(--pt)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-block-start:40px}
.pn a{display:block;min-block-size:var(--tap);background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px 20px;transition:transform .25s,box-shadow .25s,border-color .25s}
@media(hover:hover){.pn a:hover{transform:translateY(-4px);box-shadow:var(--sh);border-color:var(--p2)}}
.pn small{color:var(--pt);font-weight:600;display:block}.pn b{display:block;line-height:1.6;font-size:15.5px;overflow-wrap:anywhere}.pn .nx{text-align:end}
@media(max-width:800px){.pn{grid-template-columns:1fr}}

/* back-to-top + footer */
#top{position:fixed;inset-inline-end:max(16px,env(safe-area-inset-left),env(safe-area-inset-right));inset-block-end:calc(16px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;border:0;background:var(--gold);color:#2e2000;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 22px #d9b25a66;opacity:0;pointer-events:none;transform:translateY(12px);transition:.3s;z-index:50}#top.on{opacity:1;pointer-events:auto;transform:none}#top .i{width:20px;height:20px}
footer{background:linear-gradient(170deg,#0f3358,#061a30);color:#bfd2e8;text-align:center;padding:30px var(--gut) calc(30px + env(safe-area-inset-bottom));font-size:14px}
footer a{color:#f3dc96;font-weight:600;display:inline-flex;align-items:center;min-block-size:var(--tap)}

/* ===== small screens ===== */
@media(max-width:560px){
.brand small{display:none}.brand>span{font-size:19px}
.nav .btn{inline-size:var(--tap);padding:0;border-radius:13px}.nav .btn span{display:none}
.bar{position:static}
.sr{order:-1;flex:1 1 100%;max-width:none}.sort{flex:1 1 100%}
.shr .r .sb{flex:1 1 calc(50% - 10px)}
.tools{padding:8px 10px}

}
@media(max-width:360px){.nav{gap:8px}.brand img{width:40px;height:40px}.brand{gap:8px}.card .btn{align-self:stretch}}
[hidden]{display:none!important}
.rd,.rich,.rd .body{min-width:0;max-width:100%}
/* ===== الأكثر سؤالاً ===== */
.tq{padding-block:6px 4px}.tq h2{font-family:var(--serif);font-size:clamp(1.3rem,1.1rem + .8vw,1.7rem);line-height:1.5}.tqs{color:var(--mu);font-size:14px;margin-block:2px 14px}
.tql{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}@media(min-width:760px){.tql{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---- مقال صوتي: Web Speech API، مقاطع قصيرة لتفادي توقف المتصفح، ويظهر الزر فقط إن وُجد صوت عربي ---- */
const SS=window.speechSynthesis,hasTTS=!!(SS&&window.SpeechSynthesisUtterance),AU={seg:[],i:0,on:false,gen:0,mk:null,u:null,rate:parseFloat(LS.get('arate'))||1};
const arVoices=()=>hasTTS?SS.getVoices().filter(v=>/^ar([-_]|$)/i.test(v.lang)):[];
const auVoice=()=>{const L=arVoices();return L.find(v=>/^ar[-_]EG/i.test(v.lang))||L.find(v=>/^ar[-_]SA/i.test(v.lang))||L[0]||null};
function auSplit(t,max){const out=[],P=t.match(/[^.!?؟…:؛\n]+[.!?؟…:؛]*\s*/g)||[t];let cur='';
for(let p of P){p=p.trim();if(!p)continue;if((cur?cur+' '+p:p).length<=max){cur=cur?cur+' '+p:p;continue}if(cur)out.push(cur);cur=p;
while(cur.length>max){let k=cur.lastIndexOf('،',max);if(k<max*.4)k=cur.lastIndexOf(' ',max);if(k<max*.4)k=max;out.push(cur.slice(0,k+1).trim());cur=cur.slice(k+1).trim()}}
if(cur)out.push(cur);return out}
function auBuild(i){const S=[],add=(el,tx)=>{tx=(tx||'').replace(/(^|\s)د\.\s/g,'$1دكتور ').replace(/\s+/g,' ').trim();if(tx.length<2)return;auSplit(tx,180).forEach(c=>S.push({el,t:c}))};
const own=el=>{const c=el.cloneNode(true);c.querySelectorAll('ul,ol,.anc,figure,.cb,.tw,button,details,input,svg').forEach(x=>x.remove());return c.textContent};
add(rd.querySelector('h1'),i.title);const ld=rd.querySelector('.lead');if(ld)add(ld,ld.textContent);
bd.querySelectorAll('h1,h2,h3,h4,p,li,.co-t,summary').forEach(el=>{if(el.closest('.cb,.tw,.lc,pre,figure'))return;if(el.tagName=='P'&&el.closest('li'))return;add(el,own(el))});return S}
function auMark(el){if(AU.mk)AU.mk.classList.remove('speaking');AU.mk=el||null;if(!el)return;el.classList.add('speaking');const r=el.getBoundingClientRect();if(r.top<hh()+8||r.bottom>innerHeight-60)el.scrollIntoView({block:'center',behavior:'smooth'})}
function auUi(){const p=document.getElementById('aup'),t=document.getElementById('aut');if(!p)return;p.textContent=AU.on?'⏸ إيقاف مؤقت':(AU.i>0&&AU.i<AU.seg.length?'▶ متابعة':'▶ تشغيل');t.textContent=AU.seg.length&&(AU.on||AU.i>0)?'مقطع '+nf(Math.min(AU.i+1,AU.seg.length))+' / '+nf(AU.seg.length):''}
function auSpeak(){if(!AU.on)return;const s=AU.seg[AU.i];if(!s){auStop();return}const g=++AU.gen,u=new SpeechSynthesisUtterance(s.t),v=auVoice();
if(v){u.voice=v;u.lang=v.lang}else u.lang='ar-SA';u.rate=AU.rate;AU.u=u;
u.onend=()=>{if(g!==AU.gen)return;AU.i++;auSpeak()};
u.onerror=e=>{if(g!==AU.gen)return;if(e&&(e.error=='interrupted'||e.error=='canceled'))return;AU.i++;auSpeak()};
auMark(s.el);auUi();SS.speak(u)}
/* الإيقاف المؤقت = إلغاء + حفظ الموضع (pause/resume الأصلية غير موثوقة على أندرويد) */
function auRestart(){AU.gen++;SS.cancel();setTimeout(auSpeak,90)}
function auStop(){AU.on=false;AU.gen++;AU.i=0;if(hasTTS)try{SS.cancel()}catch(e){}auMark(null);auUi();const a=document.getElementById('aud');if(a)a.hidden=true}
function initAudio(i){if(!hasTTS)return;AU.seg=[];AU.i=0;AU.on=false;
const show=()=>{if(!arVoices().length)return false;ls.hidden=false;return true};
if(!show()){try{SS.addEventListener('voiceschanged',show)}catch(e){}let n=0;const iv=setInterval(()=>{if(show()||++n>12)clearInterval(iv)},400)}
aur.value=String(AU.rate);
ls.onclick=()=>{if(!AU.seg.length)AU.seg=auBuild(i);if(!AU.seg.length)return;aud.hidden=false;if(AU.on){AU.on=false;AU.gen++;SS.cancel();auUi();return}AU.on=true;auRestart()};
aup.onclick=()=>{if(AU.on){AU.on=false;AU.gen++;SS.cancel();auUi()}else{if(!AU.seg.length)AU.seg=auBuild(i);if(AU.i>=AU.seg.length)AU.i=0;AU.on=true;auRestart()}};
aus.onclick=auStop;

const a=document.querySelector('.tocs [data-toc="'+c+'"]'),bx=a&&a.closest('.toc');if(bx&&bx.scrollHeight>bx.clientHeight)bx.scrollTop=a.offsetTop-bx.clientHeight/2+a.offsetHeight/2}
