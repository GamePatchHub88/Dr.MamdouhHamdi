const SP=jget('/api/settings').then(s=>{s=s&&typeof s=='object'?s:{};Object.assign(S,s);applyT();applyF();if(s.img_mark)document.querySelectorAll('.brand img').forEach(i=>i.src=s.img_mark)}).catch(()=>{});
const V=$('#view'),SS=$('#ssr'),DISC='هذا الاختبار أداة توعوية مبسّطة وليس تشخيصاً طبياً أو نفسياً، ولا يغني عن تقييم مختص. تُحسب نتيجتك داخل متصفحك فقط، ولا تُحفظ ولا تُرسل إلى أي خادم.';
const SAFE='إذا كانت لديك أفكار لإيذاء نفسك أو شعور بالخطر، فتوجّه فوراً إلى أقرب طوارئ أو تواصل مع رقم الطوارئ في بلدك، ولا تنتظر نتيجة أي اختبار.';
const cur=()=>{let id=(location.pathname.match(/^\/tests\/([^\/]+)/)||[])[1]||new URLSearchParams(location.search).get('t')||'';try{id=decodeURIComponent(id)}catch(e){}return TESTS.byId(id)};
const cardH=t=>`<a class="tc" href="/tests/${encodeURIComponent(t.id)}"><div class="ci">${U(t.icon)}</div><h3>${esc(t.title)}</h3><p>${esc(t.short)}</p><div class="mt"><span>${t.q.length} أسئلة · ${t.min==1?'دقيقة':'دقيقتان'}</span><span class="go">ابدأ ${U('arr')}</span></div></a>`;
const setSeo=(t,d)=>{if(!R.dataset.ssr){document.title=t;const m=document.getElementById('md');if(m)m.content=d}};
function showIndex(){SS.innerHTML='';setSeo('اختبارات التقييم الذاتي | دوبامين — د. ممدوح حمدي','اختبارات تقييم ذاتي مجانية وسرّية: التوتر، النوم، الاحتراق النفسي، القلق، وجودة العلاقة.');
V.innerHTML=`<div class="ph"><span class="ey">اختبر نفسك</span><h1>اختبارات التقييم الذاتي</h1><p>اختبارات قصيرة تساعدك على فهم حالتك النفسية والأسرية وتعطيك خطوات عملية. مجانية وسرّية، وتُحسب نتيجتك في متصفحك دون إرسال أي بيانات.</p></div><div class="tg">${TESTS.list.map(cardH).join('')}</div><div class="note">${U('shield')}<span>${esc(DISC)}</span></div>`}
let t,ans,qi;
function showIntro(){SS.innerHTML='';setSeo(t.title+' | دوبامين — د. ممدوح حمدي',t.desc);
V.innerHTML=`<div class="ph"><span class="ey">اختبار تقييم ذاتي</span><h1>${esc(t.title)}</h1><p>${esc(t.desc)}</p></div><div class="box"><div class="chips"><span>${U('list')} ${t.q.length} أسئلة</span><span>${U('clk')} ${t.min==1?'أقل من دقيقة':'نحو دقيقتين'}</span><span>${U('shield')} سرّي بدون تسجيل</span></div><p>${esc(t.period)}</p><div style="margin-top:18px"><button class="btn lg" id="go">${U('arr')} ابدأ الاختبار</button></div><div class="note">${U('alert')}<span>${esc(DISC)}</span></div></div><div class="more"><a class="btn o sm" href="/tests">${U('list')} كل الاختبارات</a></div>`;
$('#go').onclick=()=>{ans=[];qi=0;showQ()}}
function showQ(){const q=t.q[qi],n=t.q.length,v=ans[qi];
V.innerHTML=`<div class="ph" style="padding-bottom:10px"><span class="ey">${esc(t.title)}</span></div><div class="box"><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${qi}"><i style="width:${qi/n*100}%"></i></div><div class="pm"><span>السؤال ${qi+1} من ${n}</span><span>${Math.round(qi/n*100)}%</span></div><h2 class="qt" id="qt" tabindex="-1">${esc(q.t)}</h2><fieldset class="ops" aria-labelledby="qt">${TESTS.FREQ.map((f,k)=>`<label class="op"><input type="radio" name="o" value="${k}"${v===k?' checked':''}><span>${f}</span></label>`).join('')}</fieldset><div class="qa"><button class="btn o sm" id="bk"${qi?'':' disabled'}><span style="display:inline-block;transform:scaleX(-1)">${U('arr')}</span> السابق</button><button class="btn sm" id="nx"${v==null?' disabled':''}>${qi==n-1?'إظهار النتيجة':'التالي'}</button></div></div>`;
const nx=()=>{if(ans[qi]==null)return;if(qi==n-1)showRes();else{qi++;showQ()}};
document.querySelectorAll('.op input').forEach(i=>i.onchange=()=>{ans[qi]=+i.value;$('#nx').disabled=false;clearTimeout(showQ.t);showQ.t=setTimeout(nx,260)});
$('#bk').onclick=()=>{clearTimeout(showQ.t);if(qi){qi--;showQ()}};$('#nx').onclick=()=>{clearTimeout(showQ.t);nx()};
if(qi||ans.length)$('#qt').focus({preventScroll:true});scrollTo({top:0,behavior:'smooth'})}
function showRes(){const r=TESTS.score(t,ans),b=r.band,lvIc={low:'chk',mid:'alert',high:'alert'}[r.level];
const msg='أجريت اختبار «'+t.title.replace('اختبار ','')+'» في موقعكم وكانت نتيجتي: '+b.label+'. أرغب في حجز جلسة.';
const wn=(S.whatsapp||'').replace(/\D/g,''),wa=wn?'https://wa.me/'+wn+'?text='+encodeURIComponent(msg):'';
const cta=r.level=='low'?`<div class="cta soft"><h3>واصل رحلتك نحو توازن أفضل</h3><p>نتيجتك مطمئنة. تابع مقالاتنا العملية، وإن أحببت جلسة وقائية أو لديك أسئلة فنحن هنا.</p><div class="acts"><a class="btn" href="/articles">${U('file')} اقرأ المقالات</a><button class="btn o" id="bkb">${U('cal')} احجز جلسة</button><a class="btn o" href="/#ask">${U('msg')} اسأل الدكتور</a></div></div>`:
`<div class="cta"><h3>${r.level=='high'?'ننصحك بعدم تأجيل الاستشارة':'جلسة واحدة قد تغيّر الكثير'}</h3><p>${r.level=='high'?'نتيجتك تستحق اهتماماً متخصصاً. احجز جلسة سرّية ونضع معاً خطة مناسبة لحالتك.':'احجز جلسة استشارية لنفهم وضعك ونضع خطوات عملية قبل أن تتفاقم الأمور.'}</p><div class="acts"><button class="btn g" id="bkb">${U('cal')} احجز جلسة</button>${wa?`<a class="btn wa" target="_blank" rel="noopener" href="${esc(wa)}">${U('wa')} واتساب</a>`:''}<a class="btn" href="/#ask">${U('msg')} اسأل الدكتور</a></div></div>`;
V.innerHTML=`<div class="ph" style="padding-bottom:10px"><span class="ey">${esc(t.title)}</span></div><div class="box rs"><span class="lv ${r.level}">${U(lvIc)} ${esc(b.label)}</span><h2>${esc(b.label)}</h2><div class="pc">مؤشر النتيجة: ${r.pct}%</div><div class="gauge" aria-hidden="true"><b id="mk"></b></div><div class="gl" aria-hidden="true"><span>منخفض</span><span>متوسط</span><span>مرتفع</span></div><p style="margin-top:16px">${esc(b.text)}</p><h3 style="margin-top:18px;font-size:17px">خطوات تساعدك الآن</h3><ul class="tips">${b.tips.map(x=>`<li>${U('chk')}<span>${esc(x)}</span></li>`).join('')}</ul></div>${cta}
<div class="note">${U('alert')}<span>${esc(DISC)}</span></div><div class="sf">${esc(SAFE)}</div>
<div class="more"><button class="btn o sm" id="rt">${U('arr')} أعد الاختبار</button><a class="btn o sm" href="/tests">${U('list')} اختبار آخر</a></div>
<div class="sh"><a class="btn o sm" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(t.title+' — اختبار مجاني وسرّي: '+location.origin+'/tests/'+t.id)}">${U('wa')} شارك الاختبار</a><button class="btn o sm" id="cp">${U('copy')} <span>نسخ رابط الاختبار</span></button></div>`;
requestAnimationFrame(()=>requestAnimationFrame(()=>{const m=$('#mk');if(m)m.style.insetInlineStart=r.pct+'%'}));
const bb=$('#bkb');if(bb)bb.onclick=()=>{try{sessionStorage.bookMsg=msg}catch(e){}location.href='/#book'};
$('#rt').onclick=()=>{ans=[];qi=0;showQ()};
$('#cp').onclick=async()=>{const u=location.origin+'/tests/'+t.id,l=$('#cp span');try{await navigator.clipboard.writeText(u);l.textContent='تم النسخ ✓'}catch(e){prompt('انسخ الرابط',u)}setTimeout(()=>l.textContent='نسخ رابط الاختبار',2200)};
scrollTo({top:0,behavior:'smooth'})}
t=cur();t?showIntro():showIndex();
</script></body></html>
