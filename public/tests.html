function radarSVG(L){const n=L.length,cx=230,cy=190,R0=118,an=i=>-Math.PI/2+i*2*Math.PI/n,pt=(i,r)=>[cx+r*Math.cos(an(i)),cy+r*Math.sin(an(i))],f=a=>a[0].toFixed(1)+','+a[1].toFixed(1);

function lineSVG(P){const W=460,H=190,l=36,r=14,tp=14,bt=32,n=P.length,x=i=>l+(n==1?(W-l-r)/2:i*(W-l-r)/(n-1)),y=v=>tp+(H-tp-bt)*(1-v/100);

${c.agree.length?`<h3 style="margin-top:18px;font-size:17px">ما تتفقان عليه</h3><ul class="fx">${c.agree.map(x=>`<li>${esc(x.text)}</li>`).join('')}</ul>`:''}
<h3 style="margin-top:18px;font-size:17px">خطوات تساعدكما الآن</h3><ul class="tips">${CPT.steps.map(x=>`<li>${U('chk')}<span>${esc(x)}</span></li>`).join('')}</ul></div>

const isCP=()=>/^\/tests\/couple\/?$/.test(location.pathname)||new URLSearchParams(location.search).get('t')=='couple';
addEventListener('hashchange',()=>{if(isCP())showCouple()});

const PK=()=>'tr_prog_'+t.id,getP=()=>{try{const p=JSON.parse(sessionStorage.getItem(PK())||'null');return p&&Array.isArray(p.a)&&p.q>0&&p.q<t.q.length?p:null}catch(e){return null}},setP=()=>{if(t.done)return;try{sessionStorage.setItem(PK(),JSON.stringify({a:ans,q:qi}))}catch(e){}},clrP=()=>{try{sessionStorage.removeItem(PK())}catch(e){}};
function showIntro(){SS.innerHTML='';setSeo(t.title+' | دوبامين — د. ممدوح حمدي',t.desc);
V.innerHTML=`<div class="ph"><span class="ey">اختبار تقييم ذاتي</span><h1>${esc(t.title)}</h1><p>${esc(t.desc)}</p></div><div class="box"><div class="chips"><span>${U('list')} ${t.q.length} أسئلة</span><span>${U('clk')} ${t.min==1?'أقل من دقيقة':'نحو دقيقتين'}</span><span>${U('shield')} سرّي بدون تسجيل</span></div><p>${esc(t.period)}</p><div style="margin-top:18px"><button class="btn lg" id="go">${U('arr')} ابدأ الاختبار</button></div><div class="note">${U('alert')}<span>${esc(DISC)}</span></div></div><div class="more"><a class="btn o sm" href="/tests">${U('list')} كل الاختبارات</a></div>`;
const P=getP();if(P){const b=document.createElement('button');b.className='btn o lg';b.style.marginInlineStart='10px';b.textContent='تابع من حيث توقفت (السؤال '+(P.q+1)+')';$('#go').parentNode.appendChild(b);b.onclick=()=>{ans=P.a;qi=P.q;showQ()}}
{const l=lastOf(t.id);if(l&&Date.now()-l.ts>=30*DAY){const d=document.createElement('div');d.className='cmp';d.textContent='مرّ نحو '+Math.floor((Date.now()-l.ts)/DAY)+' يوماً على آخر مرة أجريت فيها هذا الاختبار ('+fmtD(l.ts)+'). إعادته الآن تُظهر لك هل تغيّر شيء.';$('#go').parentNode.before(d)}}$('#go').onclick=()=>{clrP();ans=[];qi=0;showQ()}}
function showQ(){const q=t.q[qi],n=t.q.length,v=ans[qi];
V.innerHTML=`<div class="ph" style="padding-bottom:10px"><span class="ey">${esc(t.title)}</span></div><div class="box">${ringH(qi,n)}<h2 class="qt" id="qt" tabindex="-1">${esc(q.t)}</h2><fieldset class="ops" aria-labelledby="qt">${TESTS.FREQ.map((f,k)=>`<label class="op"><input type="radio" name="o" value="${k}"${v===k?' checked':''}><span>${f}</span></label>`).join('')}</fieldset><div class="kh" aria-hidden="true">تلميح: اضغط الأرقام 1–5 من لوحة المفاتيح للإجابة.</div><div class="qa"><button class="btn o sm" id="bk"${qi?'':' disabled'}><span style="display:inline-block;transform:scaleX(-1)">${U('arr')}</span> السابق</button><button class="btn sm" id="nx"${v==null?' disabled':''}>${qi==n-1?'إظهار النتيجة':'التالي'}</button></div></div>`;
const nx=()=>{if(ans[qi]==null)return;if(qi==n-1){clrP();(t.done||showRes)()}else{qi++;setP();showQ()}};
document.querySelectorAll('.op input').forEach(i=>i.onchange=()=>{ans[qi]=+i.value;$('#nx').disabled=false;clearTimeout(showQ.t);showQ.t=setTimeout(nx,260)});
$('#bk').onclick=()=>{clearTimeout(showQ.t);if(qi){qi--;showQ()}};$('#nx').onclick=()=>{clearTimeout(showQ.t);nx()};
document.onkeydown=e=>{if(!t||e.ctrlKey||e.metaKey||e.altKey||!$('.ops'))return;const k=+e.key;if(k>=1&&k<=5){const i=document.querySelectorAll('.op input')[k-1];if(i){i.checked=true;i.dispatchEvent(new Event('change'))}}};
if(qi||ans.length)$('#qt').focus({preventScroll:true});scrollTo({top:0,behavior:RM?'auto':'smooth'});ringGo(qi,n)}
function showRes(){const r=TESTS.score(t,ans),b=r.band,lvIc={low:'chk',mid:'alert',high:'alert'}[r.level],prev=lastOf(t.id),tp=TESTS.top(t,ans,3),rel=TESTS.list.filter(x=>x.id!=t.id&&x.cat==t.cat).slice(0,3);
const safeBox=r.flag?`<div class="alert" role="alert">${U('alert')}<div><strong>أمانك أولاً</strong>${esc(SAFE)} يمكنك أيضاً أن تخبر شخصاً قريباً منك الآن بما تشعر به، وأن تطلب مساعدة مختص في أقرب وقت.</div></div>`:'';
const diff=prev?(r.pct-prev.pct):null,cmp=prev?`<div class="cmp">آخر مرة (${esc(fmtD(prev.ts))}) كانت نتيجتك ${prev.pct}% — ${diff==0?'لم تتغير نتيجتك.':diff<0?'تحسّنت بمقدار <b class="dn">'+Math.abs(diff)+'%</b>.':'ارتفعت بمقدار <b class="up">'+diff+'%</b>.'}</div>`:'';
const fxH=tp.length?`<h3 style="margin-top:18px;font-size:17px">أكثر ما أثّر في نتيجتك</h3><ul class="fx">${tp.map(x=>`<li>${esc(x.r?'ضعف في: '+x.text:x.text)}</li>`).join('')}</ul>`:'';
const relH=rel.length?`<div class="rel"><h3>اختبارات قد تهمّك أيضاً</h3><div class="tg" style="padding-bottom:0">${rel.map(cardH).join('')}</div></div>`:'';
const extraH=resExtra(t,r),msg='أجريت اختبار «'+t.title.replace('اختبار ','')+'» في موقعكم وكانت نتيجتي: '+b.label+'. أرغب في حجز جلسة.';
const wn=(S.whatsapp||'').replace(/\D/g,''),wa=wn?'https://wa.me/'+wn+'?text='+encodeURIComponent(msg):'';
const cta=r.level=='low'?`<div class="cta soft"><h3>واصل رحلتك نحو توازن أفضل</h3><p>نتيجتك مطمئنة. تابع مقالاتنا العملية، وإن أحببت جلسة وقائية أو لديك أسئلة فنحن هنا.</p><div class="acts"><a class="btn" href="/articles">${U('file')} اقرأ المقالات</a><button class="btn o" id="bkb">${U('cal')} احجز جلسة</button><a class="btn o" href="/#ask">${U('msg')} اسأل الدكتور</a></div></div>`:
`<div class="cta"><h3>${r.level=='high'?'ننصحك بعدم تأجيل الاستشارة':'جلسة واحدة قد تغيّر الكثير'}</h3><p>${r.level=='high'?'نتيجتك تستحق اهتماماً متخصصاً. احجز جلسة سرّية ونضع معاً خطة مناسبة لحالتك.':'احجز جلسة استشارية لنفهم وضعك ونضع خطوات عملية قبل أن تتفاقم الأمور.'}</p><div class="acts"><button class="btn g" id="bkb">${U('cal')} احجز جلسة</button>${wa?`<a class="btn wa" target="_blank" rel="noopener" href="${esc(wa)}">${U('wa')} واتساب</a>`:''}<a class="btn" href="/#ask">${U('msg')} اسأل الدكتور</a></div></div>`;
V.innerHTML=`<div class="ph" style="padding-bottom:10px"><span class="ey">${esc(t.title)}</span></div>${safeBox}<div class="box rs"><span class="lv ${r.level}">${U(lvIc)} ${esc(b.label)}</span><h2>${esc(b.label)}</h2><div class="pc">مؤشر النتيجة: ${r.pct}%</div><div class="gauge" aria-hidden="true"><b id="mk"></b></div><div class="gl" aria-hidden="true"><span>منخفض</span><span>متوسط</span><span>مرتفع</span></div>${cmp}<p style="margin-top:16px">${esc(b.text)}</p>${fxH}<h3 style="margin-top:18px;font-size:17px">خطوات تساعدك الآن</h3><ul class="tips">${b.tips.map(x=>`<li>${U('chk')}<span>${esc(x)}</span></li>`).join('')}</ul>${extraH}<div class="sv"><label><input type="checkbox" id="svc"> احفظ هذه النتيجة على جهازي فقط لأقارن بها لاحقاً</label></div></div>${cta}
<div class="note">${U('alert')}<span>${esc(DISC)}</span></div><div class="sf">${esc(SAFE)}</div>
<div class="more"><button class="btn o sm" id="rt">${U('arr')} أعد الاختبار</button><a class="btn o sm" href="/tests">${U('list')} اختبار آخر</a><button class="btn o sm" id="sh">${U('arr')} شارك الاختبار</button><button class="btn o sm" id="pr">${U('file')} تقرير PDF شخصي</button></div>${relH}
<div class="sh"><a class="btn o sm" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(t.title+' — اختبار مجاني وسرّي: '+location.origin+'/tests/'+t.id)}">${U('wa')} شارك الاختبار</a><button class="btn o sm" id="cp">${U('copy')} <span>نسخ رابط الاختبار</span></button></div>`;
requestAnimationFrame(()=>requestAnimationFrame(()=>{const m=$('#mk');if(m)m.style.insetInlineStart=r.pct+'%'}));
const bb=$('#bkb');if(bb)bb.onclick=()=>{try{sessionStorage.bookMsg=msg}catch(e){}location.href='/#book'};
$('#rt').onclick=()=>{ans=[];qi=0;showQ()};
$('#pr').onclick=()=>printRep(repH(t,r,b,tp),'تقريري الشخصي — '+t.title);
$('#sh').onclick=async()=>{const d={title:t.title,text:t.short,url:location.origin+'/tests/'+t.id};try{if(navigator.share){await navigator.share(d)}else{await navigator.clipboard.writeText(d.url);$('#sh').textContent='تم نسخ الرابط ✓'}}catch(e){}};
const svc=$('#svc'),ts0=Date.now(),L0=' احفظ هذه النتيجة على جهازي فقط لأقارن بها لاحقاً',L1=' تم الحفظ على جهازك ✓ سنحفظ نتائجك القادمة تلقائياً هنا؛ ألغِ التحديد لإيقاف ذلك (أو استخدم «مسح بياناتي» في صفحة كل الاختبارات)';
const put=()=>{const a=hist();a.push({id:t.id,pct:r.pct,label:b.label,lv:r.level,ts:ts0});saveH(a);lss('tr_autosave','1');svc.parentNode.lastChild.textContent=L1};
svc.onchange=()=>{if(svc.checked)put();else{saveH(hist().filter(x=>!(x.id==t.id&&x.ts==ts0)));lsr('tr_autosave');svc.parentNode.lastChild.textContent=L0}};
if(lsg('tr_autosave')=='1'){svc.checked=true;put()}
$('#cp').onclick=async()=>{const u=location.origin+'/tests/'+t.id,l=$('#cp span');try{await navigator.clipboard.writeText(u);l.textContent='تم النسخ ✓'}catch(e){prompt('انسخ الرابط',u)}setTimeout(()=>l.textContent='نسخ رابط الاختبار',2200)};
